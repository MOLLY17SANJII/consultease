<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - ConsultEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3 px-md-4">
    <div class="container-fluid p-0">
        <a class="navbar-brand fw-bold text-wrap" href="#" style="font-size: 1.1rem;">ConsultEase Student Portal</a>
        <a href="/" class="btn btn-sm btn-light ms-auto">Logout</a>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <h3 class="fw-bold mb-3">Book a Consultation</h3>
    <div class="card p-3 p-md-4 shadow-sm">
        <form>
            <div class="row g-3">
                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold">Select Professor/Office</label>
                    <select class="form-select">
                        <option th:each="faculty : ${facultyList}" th:value="${faculty.id}" th:text="${faculty.fullName}"></option>
                        <option>Prof. Bruzula (Computer Science)</option>
                        <option>Prof. Soldevilla (IT Dept)</option>
                    </select>
                </div>
                <div class="col-12 col-sm-6 col-md-4">
                    <label class="form-label fw-semibold">Date</label>
                    <input type="date" class="form-control" required>
                </div>
                <div class="col-12 col-sm-6 col-md-4">
                    <label class="form-label fw-semibold">Time Slot</label>
                    <input type="time" class="form-control" required>
                </div>
            </div>
            <div class="mt-3 mb-3">
                <label class="form-label fw-semibold">Purpose of Consultation</label>
                <textarea class="form-control" rows="3" placeholder="e.g. Thesis Guidance, Grade Inquiry"></textarea>
            </div>
            <button type="submit" class="btn btn-success w-100 w-md-auto px-4">Submit Consultation Request</button>
        </form>
    </div>
</div>
</body>
</html>
