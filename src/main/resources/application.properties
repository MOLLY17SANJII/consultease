server.port=8080

# Database Connection (Fallback para sa Local PC at Railway variables)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:consultease_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:2007}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Config
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Resend API Key (Kinukuha mula sa Railway Variables)
resend.api.key=${RESEND_API_KEY}

# Thymeleaf Config (Hindi nag-cache para sa development)
spring.thymeleaf.cache=false

# Automatic restart para sa DevTools
spring.devtools.restart.enabled=true