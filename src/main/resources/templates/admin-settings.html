<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsultEase - Account Settings</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0e3d29;
            --dark-green: #082317;
            --accent-gold: #e2ab22;
            --accent-hover: #c99618;
            --bg-color: #f4f7f5;
            --card-bg: #ffffff;
            --text-main: #1f2923;
            --border-color: #e2e8e4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.18);
            border-bottom: 3px solid var(--accent-gold);
        }

        header h1 {
            margin: 0;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        header h1 i { color: var(--accent-gold); }

        .btn-back {
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .container-custom {
            padding: 20px 15px;
            max-width: 680px;
            margin: auto;
        }

        .card-custom {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(14, 61, 41, 0.06);
            border: 1px solid var(--border-color);
        }

        .card-custom h2 {
            color: var(--primary-green);
            margin-top: 0;
            font-size: 19px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 12px;
        }

        .section-divider {
            margin: 20px 0 12px 0;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--primary-green);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group-custom { margin-bottom: 14px; }

        .form-group-custom label {
            font-size: 11px;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
            color: #333;
            text-transform: uppercase;
        }

        .form-group-custom input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 13.5px;
        }

        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper input { padding-right: 38px; }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
            font-size: 14px;
        }

        .security-box {
            background-color: #fffdf5;
            border: 1px solid #ffe8a3;
            border-left: 4px solid var(--accent-gold);
            padding: 14px;
            border-radius: 10px;
            margin: 18px 0;
        }

        .btn-save {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999;
        }

        .toast-msg {
            min-width: 280px;
            padding: 12px 16px;
            border-radius: 10px;
            color: white;
            font-size: 13px;
        }
        .toast-msg.success { background: var(--primary-green); }
        .toast-msg.error { background: #dc3545; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <header>
        <h1><i class="fa-solid fa-graduation-cap"></i> Account Settings</h1>
        <a th:href="@{/dashboard}" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
    </header>

    <div class="container-custom">
        <div class="card-custom">
            <h2><i class="fa-solid fa-user-gear"></i> Update Profile & Password</h2>

            <form th:action="@{/settings/update}" method="post">
                <div class="section-divider">
                    <i class="fa-solid fa-id-card"></i> Information
                </div>

                <div class="form-group-custom">
                    <label for="idNumber">ID Number</label>
                    <input type="text" id="idNumber" name="idNumber" th:value="${session.loggedInUser.idNumber}" required>
                </div>

                <div class="form-group-custom">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" th:value="${session.loggedInUser.firstName}" required>
                </div>

                <div class="form-group-custom">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" th:value="${session.loggedInUser.lastName}" required>
                </div>

                <div class="form-group-custom">
                    <label for="email">Institutional Email Address</label>
                    <input type="email" id="email" name="email" th:value="${session.loggedInUser.email}" required>
                </div>

                <div class="section-divider">
                    <i class="fa-solid fa-lock"></i> Security & Password (Optional)
                </div>

                <div class="form-group-custom">
                    <label for="newPassword">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" name="newPassword" placeholder="Leave blank to keep current">
                        <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('newPassword', this)"></i>
                    </div>
                </div>

                <div class="form-group-custom">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter new password">
                        <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)"></i>
                    </div>
                </div>

                <div class="security-box">
                    <div class="form-group-custom" style="margin-bottom: 0;">
                        <label for="currentPassword"><i class="fa-solid fa-shield-halved"></i> Current Password (Required to save)</label>
                        <div class="password-wrapper">
                            <input type="password" id="currentPassword" name="currentPassword" placeholder="Enter current password" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('currentPassword', this)"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-save">
                    <i class="fa-solid fa-shield-check"></i> Save Profile
                </button>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('toast-container');
            
            /*[# th:if="${settingsSuccess}"]*/
            showToast(/*[[${settingsSuccess}]]*/ 'Profile updated successfully!', 'success');
            /*[/]*/

            /*[# th:if="${settingsError}"]*/
            showToast(/*[[${settingsError}]]*/ 'Error updating profile', 'error');
            /*[/]*/

            function showToast(msg, type) {
                const toast = document.createElement('div');
                toast.className = `toast-msg ${type}`;
                toast.innerHTML = `
                    <div style="display:flex;align-items:center;gap:8px;">
                        <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i>
                        <span>${msg}</span>
                    </div>
                `;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 5000);
            }
        });

        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
