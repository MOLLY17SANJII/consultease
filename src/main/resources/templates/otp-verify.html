<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsultEase - OTP Verification</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0e3d29;
            --accent-gold: #e2ab22;
            --glass-bg: rgba(14, 40, 28, 0.88);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-light: #ffffff;
            --text-muted: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: 
                linear-gradient(135deg, rgba(14, 61, 41, 0.92) 0%, rgba(8, 35, 23, 0.95) 50%, rgba(196, 154, 43, 0.30) 100%),
                url('/images/sjc-building.jpg') center/cover no-repeat fixed;
            color: var(--text-light);
        }

        .top-brand-bar { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; }
        .top-brand-bar i { font-size: 20px; color: var(--accent-gold); }

        .otp-card {
            background: var(--glass-bg); backdrop-filter: blur(16px);
            padding: 35px 30px; border-radius: 20px; border: 1px solid var(--card-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); width: 100%; max-width: 440px; text-align: center;
        }

        .consult-logo-circle {
            width: 75px; height: 75px; background-color: #ffffff;
            border: 3.5px solid #f1b217; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            padding: 10px; margin: 0 auto 12px auto;
            box-shadow: 0 0 15px rgba(241, 178, 23, 0.6);
        }

        .consult-logo-circle img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .otp-input {
            width: 100%; padding: 14px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.8);
            font-size: 22px; text-align: center; letter-spacing: 8px; font-weight: 800; outline: none; margin: 15px 0;
            color: #222;
        }

        .btn-submit {
            background: linear-gradient(135deg, #f5c747 0%, var(--accent-gold) 100%);
            color: var(--primary-green); font-weight: 800; border: none; width: 100%;
            padding: 14px; border-radius: 30px; font-size: 16px; cursor: pointer;
            transition: transform 0.2s; margin-bottom: 15px;
        }
        .btn-submit:hover { transform: translateY(-1px); }

        /* Spam notice box */
        .spam-alert {
            background: rgba(226, 171, 34, 0.15); border: 1px dashed var(--accent-gold);
            padding: 10px 12px; border-radius: 10px; font-size: 12px; color: #fef08a;
            margin-bottom: 15px; text-align: left; display: flex; align-items: flex-start; gap: 8px;
        }
        .spam-alert i { font-size: 14px; margin-top: 2px; color: var(--accent-gold); }

        /* Resend section */
        .resend-container { font-size: 13px; color: var(--text-muted); margin-top: 10px; }
        .resend-container a { color: var(--accent-gold); text-decoration: none; font-weight: 700; }
        .resend-container a.disabled { color: #6b7280; pointer-events: none; cursor: not-allowed; }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 12px; }
        .toast-msg { min-width: 280px; padding: 14px 18px; border-radius: 12px; color: #ffffff; font-size: 13.5px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 25px rgba(0,0,0,0.45); }
        .toast-msg.error { background: rgba(200, 35, 51, 0.95); }
        .toast-msg.success { background: rgba(14, 61, 41, 0.95); border: 1px solid var(--accent-gold); }
    </style>
</head>
<body>

    <div class="top-brand-bar">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>PHINMA EDUCATION</span>
    </div>

    <div id="toast-container"></div>

    <div class="otp-card">
        <div class="consult-logo-circle">
            <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="ConsultEase Logo">
        </div>

        <h2>Verify OTP</h2>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">
            An OTP code was sent to your school email.
        </p>

        <!-- 🟡 Check Spam Folder Reminder Box -->
        <div class="spam-alert">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <div>
                <strong>Can't find the email?</strong> Please check your <strong>Spam</strong> or <strong>Junk</strong> folder, as automated emails sometimes land there.
            </div>
        </div>

        <form th:action="@{/otp-verify}" method="post">
            <input type="text" name="otp" class="otp-input" placeholder="••••••" maxlength="6" required autocomplete="off">
            <button type="submit" class="btn-submit">VERIFY & COMPLETE</button>
        </form>

        <!-- ⏳ Resend OTP with Countdown Timer -->
        <div class="resend-container">
            Didn't receive the code? 
            <span id="countdown-text">Resend in <strong id="timer">60</strong>s</span>
            <a href="/otp-resend" id="resend-btn" style="display: none;">Resend OTP</a>
        </div>
    </div>

    <script th:inline="javascript">
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-msg ${type}`;
            const icon = type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation';
            toast.innerHTML = `
                <div style="display:flex;align-items:center;gap:10px;">
                    <i class="fa-solid ${icon}"></i>
                    <span>${message}</span>
                </div>
                <i class="fa-solid fa-xmark" style="cursor:pointer" onclick="this.parentElement.remove()"></i>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast) toast.remove(); }, 5000);
        }

        // ⏱️ Countdown Timer Logic (60 seconds)
        let timeLeft = 60;
        const timerElement = document.getElementById('timer');
        const countdownText = document.getElementById('countdown-text');
        const resendBtn = document.getElementById('resend-btn');

        const countdownInterval = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                countdownText.style.display = 'none';
                resendBtn.style.display = 'inline-block';
            }
        }, 1000);

        document.addEventListener('DOMContentLoaded', function() {
            const errorMessage = /*[[${errorMessage}]]*/ null;
            const successMessage = /*[[${successMessage}]]*/ null;
            if (errorMessage) showToast(errorMessage, 'error');
            if (successMessage) showToast(successMessage, 'success');
        });
    </script>
</body>
</html>
