<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsultEase - Student Account Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0e3d29;
            --dark-green: #082317;
            --accent-gold: #e2ab22;
            --accent-hover: #c99618;
            --bg-color: #f4f7f5;
            --card-bg: #ffffff;
            --text-main: #1f2923;
            --border-color: #e2e8e4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            color: white;
            padding: 18px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.18);
            border-bottom: 3px solid var(--accent-gold);
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }

        header h1 i { color: var(--accent-gold); }

        .btn-back {
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            white-space: nowrap;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--accent-gold);
            border-color: var(--accent-gold);
        }

        .container {
            padding: 36px 20px;
            max-width: 680px;
            margin: auto;
        }

        .card {
            background: var(--card-bg);
            padding: 36px;
            border-radius: 18px;
            box-shadow: 0 6px 24px rgba(14, 61, 41, 0.06);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            color: var(--primary-green);
            margin-top: 0;
            font-size: 21px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 14px;
        }

        .card h2 i { color: var(--accent-gold); }

        .section-divider {
            margin: 28px 0 16px 0;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--primary-green);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-divider i { color: var(--accent-gold); }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 13.5px;
            font-family: inherit;
            transition: all 0.25s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 4px rgba(226, 171, 34, 0.2);
        }

        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper input { padding-right: 42px; }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
            font-size: 14px;
        }

        .toggle-password:hover { color: var(--primary-green); }

        .security-box {
            background-color: #fffdf5;
            border: 1px solid #ffe8a3;
            border-left: 4px solid var(--accent-gold);
            padding: 18px;
            border-radius: 12px;
            margin: 24px 0;
        }

        .security-box label { color: #8a6200; }

        .btn-save {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 18px rgba(14, 61, 41, 0.25);
        }

        .btn-save:hover {
            background: linear-gradient(135deg, #092c1d 0%, #051810 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(14, 61, 41, 0.35);
        }

        /* Toast Container */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999;
        }

        .toast {
            min-width: 300px;
            padding: 14px 18px;
            border-radius: 12px;
            color: white;
            font-size: 13.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease;
        }

        .toast.success { background: var(--primary-green); border: 1px solid rgba(226, 171, 34, 0.4); }
        .toast.error { background: #dc3545; }

        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Mobile Responsiveness Additions */
        @media (max-width: 768px) {
            header {
                padding: 14px 16px;
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            header h1 {
                font-size: 17px;
                justify-content: center;
            }

            .container {
                padding: 16px 12px;
            }

            .card {
                padding: 20px 16px;
                border-radius: 12px;
            }

            .card h2 {
                font-size: 18px;
            }

            #toast-container {
                left: 16px;
                right: 16px;
                top: 10px;
            }

            .toast {
                min-width: unset;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <header>
        <h1><i class="fa-solid fa-graduation-cap"></i> Student Account Settings</h1>
        <a th:href="@{/student/dashboard}" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
    </header>

    <div class="container">
        <div class="card">
            <h2><i class="fa-solid fa-user-gear"></i> Update Profile & Password</h2>

            <form th:action="@{/settings/update}" method="post">
                <div class="section-divider">
                    <i class="fa-solid fa-id-card"></i> Student Information
                </div>

                <div class="form-group">
                    <label for="idNumber">Student ID Number</label>
                    <input type="text" id="idNumber" name="idNumber" th:value="${session.loggedInUser.idNumber}" required>
                </div>

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" th:value="${session.loggedInUser.firstName}" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" th:value="${session.loggedInUser.lastName}" required>
                </div>

                <div class="form-group">
                    <label for="email">Institutional Email Address</label>
                    <input type="email" id="email" name="email" th:value="${session.loggedInUser.email}" required>
                </div>

                <div class="section-divider">
                    <i class="fa-solid fa-lock"></i> Security & Password (Optional)
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" name="newPassword" placeholder="Leave blank to keep current password">
                        <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('newPassword', this)"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter new password">
                        <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)"></i>
                    </div>
                </div>

                <div class="security-box">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="currentPassword"><i class="fa-solid fa-shield-halved"></i> Current Password (Required to authorize changes)</label>
                        <div class="password-wrapper">
                            <input type="password" id="currentPassword" name="currentPassword" placeholder="Enter current password to save updates" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('currentPassword', this)"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-save">
                    <i class="fa-solid fa-shield-check"></i> Save Student Profile
                </button>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('toast-container');
            
            /*[# th:if="${settingsSuccess}"]*/
            showToast(/*[[${settingsSuccess}]]*/ 'Profile updated successfully!', 'success');
            /*[/]*/

            /*[# th:if="${settingsError}"]*/
            showToast(/*[[${settingsError}]]*/ 'Error updating profile', 'error');
            /*[/]*/

            function showToast(msg, type) {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                    <div style="display:flex;align-items:center;gap:8px;">
                        <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i>
                        <span>${msg}</span>
                    </div>
                    <i class="fa-solid fa-xmark" style="cursor:pointer" onclick="this.parentElement.remove()"></i>
                `;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 5000);
            }
        });

        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
